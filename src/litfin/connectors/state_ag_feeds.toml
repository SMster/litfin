# State Attorney General press-release feeds.
#
# STATUS OF THIS LIST, measured 2026-08-15: 40 candidate URLs were probed
# across 24 states using the common CMS conventions. SEVEN returned a real
# feed. The prior research estimate of "30-40 of 50 will have a working feed"
# was optimistic by a wide margin.
#
# The two highest-value states are both dark:
#   NY  -- 403 to an identified client on every path tried (WAF). Per this
#          project's standing rule, a 403 to an honest client is treated as
#          refusal of consent, NOT as a puzzle to route around.
#   TX  -- 404 on every path tried; if they publish a feed it is somewhere
#          unguessable.
#
# Multistate AG settlements (opioids, pharma, consumer protection, antitrust)
# are announced with dollar figures and are the largest publicly-disclosed
# settlement category outside securities -- so the states that DO work are
# worth having even at 14% coverage. The connector reports coverage honestly
# rather than implying the other 43 states are quiet.
#
# TO ADD A STATE: find the feed, confirm it returns <rss> or <feed> with
# items, add it below with status = "verified" and the date you checked.
# Anything not listed here is simply unknown, not known-absent.

