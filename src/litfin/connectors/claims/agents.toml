# Claims-agent routing table.
#
# Maps the agent name AS PRINTED on a court's assignment list to a canonical
# vendor, and records where that vendor publishes its case dockets.
#
# WHY THIS IS DATA AND NOT SCRAPED. The courts publish two different things: a
# directory of vendors approved in that district, and a list of which vendor
# was retained in which case. The directory tells you a vendor exists; it does
# NOT tell you that vendor's case-search endpoint, and every district prints
# the same vendor's name differently. Resolution has to happen against a
# curated list, so it lives here where a new alias is an edit rather than a
# deploy.
#
# `tos_source_id` points at the compliance registry. Anything blank -- or any
# id not registered -- fails closed as UNVERIFIED, which is the correct answer
# for a vendor nobody has reviewed. NOTHING here authorizes crawling a vendor
# site; the routing table exists so that Phase 7 has somewhere to start once a
# review clears, and so the chapter 11 census can name the agent today.
#
# MEASURED 2026-08-15 across deb, nysb, njb and ohsb.

[[agent]]
id = "epiq"
name = "Epiq Corporate Restructuring, LLC"
tos_source_id = "claims_epiq"
case_index = "https://dm.epiq11.com/"
# "Epiq" alone is how ohsb prints it; nysb prints the full LLC name.
aliases = ["epiq", "epiq corporate restructuring", "epiq bankruptcy solutions",
           "epiq systems"]

[[agent]]
id = "stretto"
name = "Stretto"
tos_source_id = "claims_stretto"
case_index = "https://cases.stretto.com/"
aliases = ["stretto", "bankruptcy management solutions"]

[[agent]]
id = "kroll"
name = "Kroll Restructuring Administration LLC"
tos_source_id = "claims_kroll"
case_index = "https://cases.ra.kroll.com/"
# Prime Clerk was renamed, not retired: njb still prints "Prime Clerk (now
# Kroll Restructuring)" on cases retained under the old name. Dropping the old
# alias would orphan every pre-2022 assignment.
aliases = ["kroll", "kroll restructuring administration", "prime clerk",
           "ra kroll"]
note = "claims_kroll is PROHIBITED in the registry (403s an identified client). The routing entry names the vendor; it does not enable fetching it."

